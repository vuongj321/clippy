<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Clippy Review{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Clippy</a>
    <nav>
      <a href="/?status=pending">Pending</a>
      <a href="/?status=approved">Approved</a>
      <a href="/?status=rejected">Rejected</a>
      <a href="/?status=all">All</a>
    </nav>
  </header>

  <section class="stats">
    <div><span class="label">Pending</span><strong>{{ stats.pending }}</strong></div>
    <div><span class="label">Approved</span><strong>{{ stats.approved }}</strong></div>
    <div><span class="label">Rejected</span><strong>{{ stats.rejected }}</strong></div>
    <div>
      <span class="label">Approve rate</span>
      <strong>
        {% if stats.approve_rate is not none %}
          {{ '%.0f'|format(stats.approve_rate * 100) }}%
        {% else %}
          —
        {% endif %}
      </strong>
    </div>
  </section>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
